name: Deploy To Hostinger

on:
  push:
    branches:
      - master
    paths-ignore:
      - "logs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-production
  cancel-in-progress: true

jobs:
  validate:
    name: Validate PHP
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(
            find . \
              -path './.git' -prune -o \
              -path './vendor' -prune -o \
              -path './uploads' -prune -o \
              -path './logs' -prune -o \
              -name '*.php' -print0
          )

  deploy:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: validate
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Load deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}

      - name: Add Hostinger host key
        shell: bash
        env:
          HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          HOSTINGER_SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -p "$HOSTINGER_SSH_PORT" -H "$HOSTINGER_SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Ensure remote directories exist
        shell: bash
        env:
          HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          HOSTINGER_SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          HOSTINGER_SSH_USERNAME: ${{ secrets.HOSTINGER_SSH_USERNAME }}
          HOSTINGER_SERVER_DIR: ${{ secrets.HOSTINGER_SERVER_DIR }}
        run: |
          set -euo pipefail
          ssh -p "$HOSTINGER_SSH_PORT" "$HOSTINGER_SSH_USERNAME@$HOSTINGER_SSH_HOST" \
            "mkdir -p '$HOSTINGER_SERVER_DIR' '$HOSTINGER_SERVER_DIR/uploads' '$HOSTINGER_SERVER_DIR/logs' '$HOSTINGER_SERVER_DIR/includes'"

      - name: Sync files to Hostinger over SSH
        shell: bash
        env:
          HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          HOSTINGER_SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          HOSTINGER_SSH_USERNAME: ${{ secrets.HOSTINGER_SSH_USERNAME }}
          HOSTINGER_SERVER_DIR: ${{ secrets.HOSTINGER_SERVER_DIR }}
        run: |
          set -euo pipefail
          rsync -az --delete --omit-dir-times --no-perms --no-owner --no-group \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='logs/' \
            --exclude='uploads/' \
            --exclude='README.md' \
            --exclude='database.sql' \
            --exclude='RCN_Mission_Hospital_Project_Specification.txt' \
            --exclude='includes/constants.php' \
            --exclude='includes/config.local.php' \
            -e "ssh -p $HOSTINGER_SSH_PORT" \
            ./ "$HOSTINGER_SSH_USERNAME@$HOSTINGER_SSH_HOST:$HOSTINGER_SERVER_DIR"
